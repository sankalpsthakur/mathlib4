name: Validate lift abbreviation preservation

on:
  push:
    branches:
      - agent/lift-preserve-abbrev

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile tactic and regression test
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get Mathlib/Tactic/Lift.lean MathlibTest/Tactic/Lift.lean
          lake env lean Mathlib/Tactic/Lift.lean
          lake env lean MathlibTest/Tactic/Lift.lean
          git diff --check origin/master...HEAD
      - name: Squash validated patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-validate-lift-abbrev.yml
          git config user.name "Sankalp Thakur"
          git config user.email "sankalphimself@gmail.com"
          git fetch origin master
          git add -A
          git reset --soft origin/master
          git commit -m "fix(Tactic/Lift): preserve abbreviated target types"
          git push --force origin HEAD:agent/lift-preserve-abbrev
