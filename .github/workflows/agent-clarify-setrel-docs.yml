name: Apply SetRel representation documentation patch

on:
  push:
    branches:
      - agent/clarify-setrel-representation-docs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clarify the representation tradeoff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Mathlib/Data/Rel.lean")
          text = path.read_text()
          old = '''There is tension throughout the library between considering relations between `α` and `β` simply as
`α → β → Prop`, or as a bundled object `SetRel α β` with dedicated operations and API.

The former approach is used almost everywhere as it is very lightweight and has arguably native
support from core Lean features, but it cracks at the seams whenever one starts talking about
operations on relations. For example:
* composition of relations `R : α → β → Prop`, `S : β → γ → Prop` is
  `Relation.Comp R S := fun a c ↦ ∃ b, R a b ∧ S b c`
* map of a relation `R : α → β → Prop` under `f : α → γ`, `g : β → δ` is
  `Relation.Map R f g := fun c d ↦ ∃ a b, r a b ∧ f a = c ∧ g b = d`.

The latter approach is embodied by `SetRel α β`, with the dedicated notation `○` for composition.
(Note that `○` is _not_ the same as function composition `∘`.)

Previously, `SetRel` suffered from the leakage of its definition as
```
def SetRel (α β : Type*) := α → β → Prop
```
The fact that `SetRel` wasn't an `abbrev` confuses automation.
But simply making it an `abbrev` would have killed the point of having a separate less see-through
type to perform relation operations on. So we instead redefined it as
```
abbrev SetRel (α β : Type*) := Set (α × β)
```
This extra level of indirection guides automation correctly and prevents (some kinds of) leakage.

Simultaneously, uniform spaces need a theory of relations on a type `α` as elements of
`Set (α × α)`, and the new definition of `SetRel` fulfills this role quite well.
'''
          new = '''There are two useful representations of a relation between `α` and `β`.
The curried form `α → β → Prop` is lightweight and convenient for pointwise application.
The set-of-pairs form `SetRel α β := Set (α × β)` is convenient when the relation itself is
manipulated as a set: it can be combined using set operations, mapped or pulled back using the
`Set` API, and used directly wherever a `Set (α × β)` is required.

Uniform spaces give an important example of the latter use. A uniformity is a filter on `α × α`, so
its members already have type `SetRel α α`. With a curried relation `R : α → α → Prop`, every use in
that API would first require converting it to `{p | R p.1 p.2}`. Representing relations as sets of
pairs avoids this repeated boundary conversion while the notation `a ~[R] b` retains pointwise use.

`SetRel` also provides relation-specific operations and notation, such as `○` for composition.
(Note that `○` is _not_ the same as function composition `∘`.) The `Set` layer additionally keeps
relation operations from unfolding immediately to curried predicates during automation.

Previously, `SetRel` was a separate definition with underlying type `α → β → Prop`. Making that
definition an `abbrev` would have exposed the curried representation everywhere, so it was instead
redefined as the abbreviation
```
abbrev SetRel (α β : Type*) := Set (α × β)
```
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one documentation block, found {count}")
          path.write_text(text.replace(old, new))
          PY

          git diff --check
          rm .github/workflows/agent-clarify-setrel-docs.yml
          git config user.name "Sankalp Thakur"
          git config user.email "sankalphimself@gmail.com"
          git add -A
          git commit -m "doc(Data/Rel): clarify the SetRel representation tradeoff"
          git push origin HEAD:agent/clarify-setrel-representation-docs
