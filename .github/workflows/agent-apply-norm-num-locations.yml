name: Apply and test norm_num location patch

on:
  push:
    branches:
      - agent/norm-num-multiple-locations

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Configure Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Apply patch, build regression, and finalize branch
        shell: bash
        run: |
          if [ ! -f .agent-patch.py ]; then
            exit 0
          fi
          python3 .agent-patch.py
          lake build MathlibTest.Tactic.NormNum.Basic
          rm -f .agent-patch.py .github/workflows/agent-apply-norm-num-locations.yml
          git config user.name "Sankalp Thakur"
          git config user.email "sankalphimself@gmail.com"
          git add -A
          git commit -m "fix(NormNum): stop after a location closes the goal"
          git push origin HEAD:"${GITHUB_REF_NAME}"
