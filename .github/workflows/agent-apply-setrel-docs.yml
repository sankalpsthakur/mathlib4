name: Apply SetRel documentation patch

on:
  push:
    branches:
      - agent/clarify-setrel-representation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused patch
        shell: bash
        run: |
          if [ ! -f .agent-patch.py ]; then
            exit 0
          fi
          python3 .agent-patch.py
          rm -f .agent-patch.py .github/workflows/agent-apply-setrel-docs.yml
          git config user.name "Sankalp Thakur"
          git config user.email "sankalphimself@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(Data/Rel): clarify SetRel representation"
          git push origin HEAD:"${GITHUB_REF_NAME}"
