name: Apply and test TM1 step-none patch

on:
  push:
    branches:
      - agent/tm1-step-none-iff

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Configure Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Apply patch, build target, and finalize branch
        shell: bash
        run: |
          if [ ! -f .agent-patch.py ]; then
            exit 0
          fi
          python3 .agent-patch.py
          lake build Mathlib.Computability.TuringMachine.PostTuringMachine
          rm -f .agent-patch.py .github/workflows/agent-apply-tm1-step-none.yml
          git config user.name "Sankalp Thakur"
          git config user.email "sankalphimself@gmail.com"
          git add -A
          git commit -m "feat(Computability): characterize halted TM1 configurations"
          git push origin HEAD:"${GITHUB_REF_NAME}"
